<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Titanium Liquid Glass Bevel Gradient -->
    <linearGradient id="obsidianGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181f"/>
      <stop offset="50%" stop-color="#0c0c10"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="30%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="70%" stop-color="rgba(255,255,255,0.02)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.25)"/>
    </linearGradient>
    <radialGradient id="fresnelGlint" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="hGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle (iOS 27 Superellipse) -->
  <rect width="512" height="512" rx="124" fill="url(#obsidianGlass)"/>
  <rect width="512" height="512" rx="124" fill="url(#fresnelGlint)"/>
  
  <!-- Outer Beveled Specular Border -->
  <rect x="4" y="4" width="504" height="504" rx="120" fill="none" stroke="url(#specularRim)" stroke-width="4" opacity="0.8"/>
  
  <!-- Subtle Inner Glass Lens -->
  <circle cx="256" cy="256" r="168" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Monogram HoL AI "H" in Pure Titanium White -->
  <g fill="none" stroke="url(#hGlint)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
    <line x1="168" y1="152" x2="168" y2="360"/>
    <line x1="344" y1="152" x2="344" y2="360"/>
    <line x1="168" y1="256" x2="344" y2="256"/>
  </g>
  
  <!-- Status Orb Pill at Top-Right of H -->
  <circle cx="344" cy="152" r="14" fill="#38bdf8"/>
  <circle cx="344" cy="152" r="8" fill="#ffffff"/>
</svg>
