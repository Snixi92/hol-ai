version: '3.8'

services:
  # Base de données PostgreSQL 16 avec extension pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hol_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hol_ai_db}
      POSTGRES_USER: ${POSTGRES_USER:-hol_ai_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_in_production}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hol_ai_admin} -d ${POSTGRES_DB:-hol_ai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7 avec persistance AOF activée pour Redis Streams
  redis:
    image: redis:7-alpine
    container_name: hol_ai_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
